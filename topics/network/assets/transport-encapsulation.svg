<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="564" viewBox="0 0 1096 564"
     role="img" aria-labelledby="title" aria-describedby="description tcp-readout tunnel-tcp-readout quic-readout tunnel-quic-readout" xml:lang="zh-CN">
  <title id="title">四种传输方式的跨网连接与实收速率</title>
  <desc id="description">按方式分为 TCP, Tailscale, HY2 和 HY2 over Tailscale. 每行从左到右为 Windows 客户端, 跨网封装和 Singapore 服务端. 协议框从外向内嵌套, 省略 IP 头. 前两行为主机之间的 TCP 连接, 后两行为 HY2 代理之间的 QUIC 连接. 端点按序交付流内字节, 并执行流量控制和拥塞控制. TCP-1 在客户端连接应用与 HY2, TCP-2 在服务端连接 HY2 与目标服务. 客户端显示下载, 服务端显示上传. 速率取持续传输的三轮实收中位数 (Mbps). Tailscale 行另列 TCP 拥塞控制算法的独立对照, 窗口算例取自其中一轮 CUBIC 下载.</desc>
  <defs>
    <marker id="arrow-left" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="10"
            refX="1" refY="5" orient="auto">
      <path d="M 6 1 L 1 5 L 6 9" fill="none" stroke="#647887" stroke-width="1.6"/>
    </marker>
    <marker id="arrow-right" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="10"
            refX="7" refY="5" orient="auto">
      <path d="M 2 1 L 7 5 L 2 9" fill="none" stroke="#647887" stroke-width="1.6"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #203641; }
      .column { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .column-note { font-size: 15px; fill: #3d5b71; text-anchor: middle; }
      .method { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .connection { fill: none; stroke: #647887; stroke-width: 1.7; marker-start: url(#arrow-left); marker-end: url(#arrow-right); }
      .leg { font-size: 15px; fill: #35576a; text-anchor: middle; }
      .transport-span path { fill: none; stroke: currentColor; stroke-width: 1.7; }
      .transport-span text { fill: currentColor; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .tcp-span { color: #286d5d; }
      .quic-span { color: #69548e; }
      .endpoint rect { fill: #fff; stroke: #8195a1; stroke-width: 1.3; }
      .endpoint text { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .layer { stroke-width: 1.5; }
      .layer.tcp, .layer.quic { stroke-width: 2.4; }
      .udp { fill: #fff1d5; stroke: #b17b22; }
      .wireguard { fill: #deebf3; stroke: #5b7e92; }
      .tcp { fill: #d9f0e9; stroke: #34816d; }
      .quic { fill: #eae6fa; stroke: #8270ad; }
      .protocol { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .sub { font-size: 13px; fill: #3d5b71; text-anchor: middle; }
      .metric-value { font-size: 20px; font-weight: 700; text-anchor: middle; font-variant-numeric: tabular-nums; }
      .algorithm-comparison text { fill: #3d5b71; font-size: 14px; text-anchor: middle; font-variant-numeric: tabular-nums; }
      .sample-leader { fill: none; stroke: #327562; stroke-width: 1.2; stroke-dasharray: 3 2; }
      .sample-label, .sample-value { font-size: 14px; fill: #265e51; text-anchor: middle; }
      .sample-label { font-weight: 700; }
    </style>
  </defs>

  <rect width="1096" height="564" fill="#fff"/>
  <rect width="1096" height="64" fill="#eaf1f5"/>
  <path d="M 0 170 H 1096 V 326 H 0 Z M 0 438 H 1096 V 564 H 0 Z" fill="#f7f9fb"/>
  <path d="M 172 0 V 564 M 398 0 V 564 M 822 0 V 564" fill="none" stroke="#d3dee4"/>
  <path d="M 0 64 H 1096 M 0 170 H 1096 M 0 326 H 1096 M 0 438 H 1096" fill="none" stroke="#d3dee4"/>
  <text class="column" x="86" y="39">方式</text>
  <text class="column" x="285" y="27">Windows 客户端</text>
  <text class="column-note" x="285" y="51">← 下载实收 (Mbps)</text>
  <text class="column" x="610" y="39">跨网封装</text>
  <text class="column" x="959" y="27">Singapore 服务端</text>
  <text class="column-note" x="959" y="51">上传实收 (Mbps) →</text>

  <g id="tcp" transform="translate(172 117)">
    <title id="tcp-readout">TCP. 跨网 TCP 连接的端点是两台主机的 TCP 栈. 下载 0.280 Mbps, 上传 76.154 Mbps.</title>
    <text class="method" x="-86" y="6">TCP</text>
    <g class="transport-span tcp-span" data-transport="TCP">
      <path d="M 48.5 -20 V -36 H 376 M 500 -36 H 859 V -20"/>
      <text x="438" y="-31">跨网 TCP 连接</text>
    </g>
    <path class="connection" d="M 83 0 H 809"/>
    <g class="endpoint">
      <rect x="17" y="-17" width="63" height="34" rx="6"/>
      <text x="48.5" y="6">应用</text>
    </g>
    <g class="endpoint">
      <rect x="812" y="-17" width="94" height="34" rx="6"/>
      <text x="859" y="6">目标服务</text>
    </g>
    <g data-protocol="TCP">
      <rect class="layer tcp" x="390" y="-18" width="100" height="36" rx="6"/>
      <text class="protocol" x="440" y="6">TCP</text>
    </g>
    <text class="metric-value" data-direction="download" x="48.5" y="42">0.280</text>
    <text class="metric-value" data-direction="upload" x="859" y="42">76.154</text>
  </g>

  <g id="tunnel-tcp" transform="translate(172 239)">
    <title id="tunnel-tcp-readout">Tailscale. WireGuard 和外层 UDP 封装内层 TCP, 跨网 TCP 连接仍终止于两台主机的 TCP 栈. 下载 0.140 Mbps, 上传 61.194 Mbps. 独立对照中, CUBIC 为 0.187 Mbps, BBR 为 2.516 Mbps. 其中一轮 CUBIC 下载的内层 TCP 窗口估算为 0.1864 Mbps, 应用实收 0.1872 Mbps.</title>
    <text class="method" x="-86" y="6">Tailscale</text>
    <g class="transport-span tcp-span" data-transport="TCP">
      <path d="M 48.5 -20 V -52 H 376 M 500 -52 H 859 V -20"/>
      <text x="438" y="-47">跨网 TCP 连接</text>
    </g>
    <path class="connection" d="M 83 0 H 809"/>
    <g class="endpoint">
      <rect x="17" y="-17" width="63" height="34" rx="6"/>
      <text x="48.5" y="6">应用</text>
    </g>
    <g class="endpoint">
      <rect x="812" y="-17" width="94" height="34" rx="6"/>
      <text x="859" y="6">目标服务</text>
    </g>
    <g data-protocol="UDP">
      <rect class="layer udp" x="287" y="-36" width="302" height="72" rx="6"/>
      <text class="protocol" x="318" y="6">UDP</text>
      <g data-protocol="WireGuard">
        <rect class="layer wireguard" x="348" y="-28" width="233" height="56" rx="6"/>
        <text class="protocol" x="407" y="-2">WireGuard</text>
        <text class="sub" x="407" y="16">Tailscale</text>
        <g data-protocol="TCP">
          <rect class="layer tcp" x="465" y="-19" width="108" height="38" rx="6"/>
          <text class="protocol" x="519" y="6">TCP</text>
        </g>
      </g>
    </g>
    <text class="metric-value" data-direction="download" x="48.5" y="42">0.140</text>
    <g class="algorithm-comparison">
      <text x="113" y="58">独立对照</text>
      <text x="113" y="77">0.187 (CUBIC) → 2.516 (BBR)</text>
    </g>
    <text class="metric-value" data-direction="upload" x="859" y="42">61.194</text>
    <g class="window-sample">
      <path class="sample-leader" d="M 519 19 V 44"/>
      <circle cx="519" cy="19" r="2.3" fill="#327562"/>
      <text class="sample-label" x="438" y="58">TCP 窗口算例 (独立测量)</text>
      <text class="sample-value" x="438" y="77">TCP 估算 0.1864 / 应用实收 0.1872 Mbps</text>
    </g>
  </g>

  <g id="quic" transform="translate(172 387)">
    <title id="quic-readout">HY2. 两个 HY2 代理是跨网 QUIC 连接的端点. TCP-1 在客户端结束, 服务端经 TCP-2 连接目标服务. 下载 41.710 Mbps, 上传 84.039 Mbps.</title>
    <text class="method" x="-86" y="6">HY2</text>
    <g class="transport-span quic-span" data-transport="QUIC">
      <path d="M 180.5 -20 V -44 H 370 M 506 -44 H 702 V -20"/>
      <text x="438" y="-39">跨网 QUIC 连接</text>
    </g>
    <path class="connection" d="M 83 0 H 146"/>
    <path class="connection" d="M 215 0 H 666"/>
    <path class="connection" d="M 738 0 H 809"/>
    <text class="leg" x="114" y="-9">TCP-1</text>
    <text class="leg" x="773" y="-9">TCP-2</text>
    <g class="endpoint">
      <rect x="17" y="-17" width="63" height="34" rx="6"/>
      <text x="48.5" y="6">应用</text>
    </g>
    <g class="endpoint">
      <rect x="149" y="-17" width="63" height="34" rx="6"/>
      <text x="180.5" y="6">HY2</text>
    </g>
    <g class="endpoint">
      <rect x="669" y="-17" width="66" height="34" rx="6"/>
      <text x="702" y="6">HY2</text>
    </g>
    <g class="endpoint">
      <rect x="812" y="-17" width="94" height="34" rx="6"/>
      <text x="859" y="6">目标服务</text>
    </g>
    <g data-protocol="UDP">
      <rect class="layer udp" x="340" y="-27" width="200" height="54" rx="6"/>
      <text class="protocol" x="377" y="6">UDP</text>
      <g data-protocol="QUIC">
        <rect class="layer quic" x="412" y="-18" width="120" height="36" rx="6"/>
        <text class="protocol" x="472" y="6">QUIC</text>
      </g>
    </g>
    <text class="metric-value" data-direction="download" x="48.5" y="42">41.710</text>
    <text class="metric-value" data-direction="upload" x="859" y="42">84.039</text>
  </g>

  <g id="tunnel-quic" transform="translate(172 511)">
    <title id="tunnel-quic-readout">HY2 over Tailscale. TCP-1 和 TCP-2 分别位于客户端和服务端. 隧道从外到内为 UDP, WireGuard, UDP, QUIC. 跨网 QUIC 连接终止于两个 HY2 代理. 下载 35.094 Mbps, 上传 72.663 Mbps.</title>
    <text class="method" x="-86" y="6">HY2 over Tailscale</text>
    <g class="transport-span quic-span" data-transport="QUIC">
      <path d="M 180.5 -20 V -56 H 370 M 506 -56 H 702 V -20"/>
      <text x="438" y="-51">跨网 QUIC 连接</text>
    </g>
    <path class="connection" d="M 83 0 H 146"/>
    <path class="connection" d="M 215 0 H 666"/>
    <path class="connection" d="M 738 0 H 809"/>
    <text class="leg" x="114" y="-9">TCP-1</text>
    <text class="leg" x="773" y="-9">TCP-2</text>
    <g class="endpoint">
      <rect x="17" y="-17" width="63" height="34" rx="6"/>
      <text x="48.5" y="6">应用</text>
    </g>
    <g class="endpoint">
      <rect x="149" y="-17" width="63" height="34" rx="6"/>
      <text x="180.5" y="6">HY2</text>
    </g>
    <g class="endpoint">
      <rect x="669" y="-17" width="66" height="34" rx="6"/>
      <text x="702" y="6">HY2</text>
    </g>
    <g class="endpoint">
      <rect x="812" y="-17" width="94" height="34" rx="6"/>
      <text x="859" y="6">目标服务</text>
    </g>
    <g data-protocol="UDP">
      <rect class="layer udp" x="238" y="-40" width="398" height="80" rx="6"/>
      <text class="protocol" x="268" y="6">UDP</text>
      <g data-protocol="WireGuard">
        <rect class="layer wireguard" x="298" y="-32" width="330" height="64" rx="6"/>
        <text class="protocol" x="357" y="-2">WireGuard</text>
        <text class="sub" x="357" y="16">Tailscale</text>
        <g data-protocol="UDP">
          <rect class="layer udp" x="417" y="-24" width="203" height="48" rx="6"/>
          <text class="protocol" x="452" y="6">UDP</text>
          <g data-protocol="QUIC">
            <rect class="layer quic" x="487" y="-16" width="125" height="32" rx="6"/>
            <text class="protocol" x="549.5" y="6">QUIC</text>
          </g>
        </g>
      </g>
    </g>
    <text class="metric-value" data-direction="download" x="48.5" y="42">35.094</text>
    <text class="metric-value" data-direction="upload" x="859" y="42">72.663</text>
  </g>
  <rect x="0.5" y="0.5" width="1095" height="563" fill="none" stroke="#c3d0d8"/>
</svg>
